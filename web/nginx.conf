server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 画面からの API 呼び出しを Kev コンテナへ中継する（/kev/v1/... → kev:8008/v1/...）
    location /kev/ {
        proxy_pass http://kev:8008/;
        proxy_set_header Host $host;
        # CPU 実行は時間がかかることがあるため長めに待つ
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
